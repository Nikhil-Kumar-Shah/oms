# ==============================================================================
# PARADOX SPORTS OMS - DEVELOPMENT LOCALHOST NGINX CONFIGURATION
# Localhost Single-Port Reverse Proxy (http://localhost)
# ==============================================================================

upstream dev_backend_upstream {
    server 127.0.0.1:8000;
}

upstream dev_frontend_upstream {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Public Health Probe
    location = /health {
        proxy_pass http://dev_backend_upstream/health;
        proxy_set_header Host $host;
    }

    # REST API Routes (/api/v1/*) -> FastAPI
    location /api/v1/ {
        proxy_pass http://dev_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Support (Next.js HMR + FastAPI WS)
    location /_next/webpack-hmr {
        proxy_pass http://dev_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /ws/ {
        proxy_pass http://dev_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Next.js Static & Page Routing
    location / {
        proxy_pass http://dev_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
