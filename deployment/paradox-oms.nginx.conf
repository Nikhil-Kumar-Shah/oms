# ==============================================================================
# PARADOX SPORTS OMS - PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# Production Architecture: Next.js (Port 3000) + FastAPI (Port 8000) + PostgreSQL
# ==============================================================================

# Rate Limiting Zones (Nginx Layer Defense)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=global_api_limit:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=300r/m;

# Upstream Backend Pool (FastAPI + Uvicorn Workers)
upstream paradox_backend_upstream {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Upstream Frontend Pool (Next.js Production Node Server)
upstream paradox_frontend_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP Server (Port 80): ACME Challenge & Automatic HTTPS Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name oms.nikhilkshah.me oms.paradoxsports.org localhost;

    # Let's Encrypt ACME Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS (Preserving URI)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS Server (Port 443): SSL Termination, Unified Routing & Security Hardening
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oms.nikhilkshah.me oms.paradoxsports.org;

    # SSL Certificates (Certbot / Custom TLS)
    ssl_certificate /etc/letsencrypt/live/oms.nikhilkshah.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oms.nikhilkshah.me/privkey.pem;

    # SSL Protocol & Modern Cipher Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers (Applied Globally)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Payload Size Limits & Timeouts
    client_max_body_size 25M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    send_timeout 30s;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. Minimal Public Health Probe (/health)
    # --------------------------------------------------------------------------
    location = /health {
        proxy_pass http://paradox_backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 2. Authentication API (Rate-Limited Protection)
    # --------------------------------------------------------------------------
    location ~ ^/api/v1/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://paradox_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 3. REST API Routes (/api/v1/*) -> FastAPI Backend
    # --------------------------------------------------------------------------
    location /api/v1/ {
        limit_req zone=global_api_limit burst=30 nodelay;

        proxy_pass http://paradox_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 4. WebSocket Connections (/ws/*) -> FastAPI Backend
    # --------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://paradox_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 5. Blocked / Disabled Endpoints in Production
    # --------------------------------------------------------------------------
    location /dev {
        return 404;
    }

    # --------------------------------------------------------------------------
    # 6. Next.js Static Chunks & Build Assets (Aggressive Caching)
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://paradox_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/ {
        proxy_pass http://paradox_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 7. Static Application Assets (/static/*)
    # --------------------------------------------------------------------------
    location /static/ {
        alias /opt/paradox-oms/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 8. Next.js Production Application Root (SSR & Page Routes)
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=frontend_limit burst=50 nodelay;

        proxy_pass http://paradox_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
